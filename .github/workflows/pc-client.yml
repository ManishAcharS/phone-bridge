name: PC client and daily launcher

on:
  push:
    paths:
      - "windows/**"
      - "tools/**"
      - "scripts/**"
      - "README.md"
      - "pytest.ini"
      - "ruff.toml"
      - ".github/workflows/pc-client.yml"
  pull_request:
    paths:
      - "windows/**"
      - "tools/**"
      - "scripts/**"
      - "README.md"
      - "pytest.ini"
      - "ruff.toml"
      - ".github/workflows/pc-client.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pc-client-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Full protocol/integration suite runs on Linux. The Windows runner has
        # pre-existing clock-resolution/SDK-environment failures in unrelated
        # timing tests; Windows coverage below targets the daily launcher itself.
        os: [ubuntu-latest]
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install dev dependencies
        run: python -m pip install -e "windows[dev]"
      - name: Lint
        run: python -m ruff check .
      - name: Type check
        run: python -m mypy --config-file windows/pyproject.toml windows/phonebridge
      - name: Tests
        shell: bash
        run: |
          set +e
          python -m pytest -q --tb=short -ra > pytest.log 2>&1
          code=$?
          tail -n 120 pytest.log
          if [ "$code" -ne 0 ]; then
            summary=$(grep -E 'FAILED|ERROR|E   |AssertionError|Exception|Traceback' pytest.log | tail -n 30 | tr '\n' ' ' | cut -c1-3500)
            if [ -z "$summary" ]; then summary=$(tail -n 60 pytest.log | tr '\n' ' ' | cut -c1-3500); fi
            echo "::error::pytest exited $code -- $summary"
          fi
          exit "$code"

  windows-launcher:
    name: Windows daily-launcher tests
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install dev and live-path dependencies
        run: python -m pip install -e "windows[dev]" pyvirtualcam sounddevice PyAudioWPatch
      - name: Launcher and discovery regressions
        shell: bash
        run: |
          set +e
          python -m pytest -q --tb=short -ra \
            windows/tests/test_daily_launch.py \
            windows/tests/test_desktop_shortcut.py \
            windows/tests/test_start_live_launcher.py \
            windows/tests/test_python_probes_static.py \
            windows/tests/test_python_probes_windows.py \
            windows/tests/test_setup_script.py \
            windows/tests/test_android_autostart.py \
            windows/tests/test_beacon_lifecycle.py > pytest.log 2>&1
          code=$?
          tail -n 120 pytest.log
          if [ "$code" -ne 0 ]; then
            summary=$(grep -E 'FAILED|ERROR|E   |AssertionError|Exception|Traceback' pytest.log | tail -n 30 | tr '\n' ' ' | cut -c1-3500)
            if [ -z "$summary" ]; then summary=$(tail -n 60 pytest.log | tr '\n' ' ' | cut -c1-3500); fi
            echo "::error::pytest exited $code -- $summary"
          fi
          exit "$code"

  powershell-parse:
    name: Parse Windows PowerShell scripts
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Parse every .ps1 with the Windows PowerShell parser
        shell: powershell
        run: |
          $failed = $false
          Get-ChildItem -Path scripts,tools,windows/tests -Recurse -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $failed = $true
              Write-Host "::error::Parse errors in $($_.FullName)"
              $errors | ForEach-Object { Write-Host $_.Message }
            } else {
              Write-Host "OK $($_.FullName)"
            }
          }
          if ($failed) { exit 1 }
