name: Android debug APK

# Builds the app from android/ and uploads the debug APK as a downloadable
# artifact. Nothing is signed with a secret: the debug keystore Gradle generates
# on the runner is enough to `adb install` the result.
#
# There is deliberately no `branches:` filter, so it runs for a push to any
# branch that touches android/ (a workflow that is not on the default branch
# cannot be started with workflow_dispatch from the UI).
on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android-debug-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

# One build per branch: pushing twice in a minute should not queue two Gradles.
concurrency:
  group: android-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The runner image already ships the Android SDK, so this only finds it and
      # makes sure the one platform/build-tools this project pins (34) is there.
      # A third-party "setup-android" action is not used: it failed on this image
      # and adds a download that the image already paid for.
      - name: Prepare the Android SDK
        shell: bash
        run: |
          set -uo pipefail
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$sdk" ]; then
            echo "::error::no Android SDK found (ANDROID_HOME='${ANDROID_HOME:-}', ANDROID_SDK_ROOT='${ANDROID_SDK_ROOT:-}')"
            exit 1
          fi
          {
            echo "ANDROID_HOME=$sdk"
            echo "ANDROID_SDK_ROOT=$sdk"
          } >> "$GITHUB_ENV"
          echo "SDK: $sdk"
          echo "platforms:   $(ls "$sdk/platforms" 2>/dev/null | tr '\n' ' ')"
          echo "build-tools: $(ls "$sdk/build-tools" 2>/dev/null | tr '\n' ' ')"

          sdkmanager="$sdk/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$sdkmanager" ]; then
            echo "::error::sdkmanager missing at $sdkmanager"
            exit 1
          fi
          yes | "$sdkmanager" --licenses > /tmp/licenses.log 2>&1 || true
          if ! "$sdkmanager" --list_installed 2>/dev/null | grep -q 'platforms;android-34'; then
            echo "installing platforms;android-34 and build-tools;34.0.0"
            if ! "$sdkmanager" "platforms;android-34" "build-tools;34.0.0" > /tmp/install.log 2>&1; then
              tail=$(tail -n 15 /tmp/install.log | tr '\n' ' | ' | cut -c1-1200)
              echo "::error::sdkmanager could not install the pinned platform: $tail"
              exit 1
            fi
          fi
          echo "platforms:   $(ls "$sdk/platforms" 2>/dev/null | tr '\n' ' ')"
          echo "build-tools: $(ls "$sdk/build-tools" 2>/dev/null | tr '\n' ' ')"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle.kts', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # The step keeps the whole Gradle output in the log, and repeats the tail in
      # an annotation: the log itself is not always reachable, the annotation is.
      - name: Build the debug APK
        working-directory: android
        shell: bash
        run: |
          set +e
          chmod +x ./gradlew
          java -version 2>&1 | head -3
          ./gradlew --no-daemon --console=plain --stacktrace assembleDebug 2>&1 | tee /tmp/gradle.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            # A stack trace's last lines are never the cause. Gradle puts the
            # reason in "* What went wrong:", the compiler in "e: "/"error:".
            summary=$(awk '/\* What went wrong:/{flag=1;next} flag && NF {print; if(++n>=12) exit}' /tmp/gradle.log | tr '\n' ' ' | cut -c1-1200)
            # Kotlin writes "e: <path>: (line, col): <reason>"; repeat those first.
            errors=$(grep -E '^e: ' /tmp/gradle.log | head -n 40 | sed 's|file://[^ ]*/android/|android/|' | tr '\n' ' ' | cut -c1-4500)
            echo "::error::gradlew assembleDebug exited $code -- wrong: ${summary:-none} -- errors: ${errors:-none}"
            exit "$code"
          fi
          ls -l app/build/outputs/apk/debug/

      # Unit tests. `Nv21Test` pins the YUV_420_888 -> NV21 packing (row strides,
      # interleaved vs planar chroma, crop rectangles) as bytes: that maths is
      # what stalls a camera when it is wrong, and it needs no device to check.
      - name: Run the unit tests
        working-directory: android
        shell: bash
        run: |
          ./gradlew --no-daemon --console=plain testDebugUnitTest
          # A test task with no sources passes silently, which would make "the
          # packing tests ran" an assumption. Count the cases and fail if they
          # are not there: Nv21Test (the YUV_420_888 -> NV21 layouts) and
          # SerialSenderTest (the frame counter under concurrency).
          results=app/build/test-results/testDebugUnitTest
          ls "$results"
          cases=$(grep -h '<testcase ' "$results"/*.xml | wc -l)
          echo "unit test cases: $cases"
          if [ "$cases" -lt 10 ]; then
            echo "::error::expected at least 10 unit test cases, found $cases"
            exit 1
          fi

      # The method names the PC client calls live in the dex string pool, so this
      # is a cheap way to show the APK being uploaded is not a stale one. It is a
      # warning, not a failure: the phone is the only real proof.
      - name: Check the APK mentions the live handlers
        working-directory: android
        shell: bash
        run: |
          set -uo pipefail
          apk=app/build/outputs/apk/debug/app-debug.apk
          ls -l "$apk"
          sha256sum "$apk"
          for method in audio.mic.start camera.start audio.playback.start; do
            count=$(unzip -p "$apk" 'classes*.dex' | grep -a -o -- "$method" | wc -l)
            echo "$method: $count occurrence(s)"
            if [ "$count" -eq 0 ]; then
              echo "::warning::$method is not in the APK's dex strings"
            fi
          done

      - name: Stage the APK
        shell: bash
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk "out/phonebridge-debug-${GITHUB_SHA::12}.apk"

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: phonebridge-debug-apk
          path: out/*.apk
          if-no-files-found: error
          retention-days: 30
