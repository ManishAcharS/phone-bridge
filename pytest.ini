# Running `pytest` from the repository root (the common habit) must behave the
# same as running it from `windows/`. Without this file, the root directory wins
# as pytest's rootdir and `windows/pyproject.toml`'s settings are ignored, which
# silently breaks every async test (`async def functions are not natively
# supported`). Kept deliberately minimal; `windows/pyproject.toml` holds the
# packaging metadata and the same asyncio_mode for in-directory runs.
[pytest]
testpaths = windows/tests
asyncio_mode = auto
pythonpath = windows tools/simulator tools/vectorgen
addopts = -q
filterwarnings =
    ignore::DeprecationWarning
